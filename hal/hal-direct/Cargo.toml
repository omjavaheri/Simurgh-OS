# ============================================================================
# hal-direct
#
# The optional, capability-gated half of the HAL, per 01-HAL-Layer.md
# section 1:
#
#   HAL
#    ├── hal-core      -> always active, safe, auto-detect, no config needed
#    └── hal-direct    -> optional, capability-gated
#
# Per section 1's explicit requirement, hal-core and hal-direct "باید از
# هم جدا (در کد و در باینری نهایی) باشند" — must be separate both in
# code AND in the final binary. Keeping this as its own crate (rather
# than a feature flag on hal-core) is what makes that separation real:
# a build that never links hal-direct at all is possible simply by not
# listing it as a dependency, with no `#[cfg]` gymnastics needed.
#
# Per section 5, every function in this crate requires a valid
# `CapabilityToken` minted by the Security/Permission Broker (layer 4):
# "هیچ تابعی در hal-direct بدون CapabilityToken معتبر اجرا نمی‌شود...
# صدور این token مسئولیت Security/Permission Broker در لایه ۴ است، نه
# HAL. HAL فقط توکن را verify می‌کند."
# ============================================================================

[package]
name        = "hal-direct"
description = "Capability-gated direct hardware access for professional users and driver authors"
edition.workspace    = true
version.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true

[lib]
# Like hal-core, this crate's own unit tests (mock CapabilityToken
# verification logic) run on the host target by default. Real
# architecture-specific implementations of `HalDirectAccess` live in
# hal-x86_64 / hal-arm64 / hal-riscv64, each gated behind a --target
# build, exactly mirroring hal-core's structure.

[dependencies]
# hal-direct's trait signatures (map_mmio_region, etc.) are expressed
# in terms of hal-core's PhysAddr/VirtAddr and HalError, so the two
# crates must speak the exact same address/error types — see
# 01-HAL-Layer.md section 5's pre-draft trait, which reuses HalError
# directly rather than defining a parallel error type.
hal-core = { path = "../hal-core" }

# Ed25519 `TokenVerifier` implementation (Issue #29): only public keys
# ever need to live in a hal-<arch> image (the Security Broker, layer
# 4, is the sole holder of the signing/private key) — asymmetric
# signing means a leaked/dumped kernel image reveals nothing an
# attacker could use to forge a token, unlike a shared HMAC secret
# that would have to be embedded identically in all three hal-<arch>
# crates. `default-features = false` drops ed25519-dalek's own
# defaults (`fast` + `zeroize`) so nothing here is accidental; `fast`
# is re-enabled explicitly (precomputed-table verification — larger
# `.rodata`, no allocation). `zeroize` stays off: it exists to scrub
# SECRET key material, and this crate only ever holds the PUBLIC key
# (verification-only, no signing). Every transitive dependency
# (ed25519-dalek, ed25519, curve25519-dalek, sha2, subtle) is itself
# `default-features = false` and `#![no_std]` at this feature set —
# confirmed by reading their published Cargo.toml/lib.rs, not assumed.
ed25519-dalek = { version = "3", default-features = false, features = ["fast"], optional = true }

[dev-dependencies]
# No extra crates needed for the same reason as hal-core: host-target
# unit tests use std implicitly, the crate under test stays no_std.

[features]
default = []
# Enables the concrete Ed25519 TokenVerifier (Issue #29's algorithm
# decision). Off by default so a build that never needs hal-direct at
# all (section 1's separation requirement) never pulls in the crypto
# dependency either; a hal-<arch> crate that wants a real (non-mock)
# verifier turns this on alongside its own hal-direct-support feature.
ed25519 = ["dep:ed25519-dalek"]