# ============================================================================
# Release — auto-tag + auto-publish a GitHub Release after every merge to
# `main` that passes CI.
#
# Triggered by `workflow_run` on the CI workflow (`.github/workflows/
# ci.yml`, `name: CI`) finishing, not by `push` directly — this way a
# release is only ever created once CI has actually reported a real
# `success` conclusion for that exact commit, which is the whole point:
# with branch protection on `main` requiring a pull request + an approving
# review + passing status checks (see `.claude`/repo docs for the exact
# settings — GitHub's branch-protection UI itself is not something a
# workflow file can configure), the only way a commit ever reaches `main`
# is "someone opened a PR, CI ran, a human approved it, GitHub merged it" —
# so this workflow's own gate ends up meaning "a human-approved,
# CI-green change just landed on main", which is exactly what should get
# a new Release.
#
# Versioning: auto-increments the PATCH component of the latest `vX.Y.Z`
# tag (starts at `v0.1.0` if no tag exists yet, matching this project's
# own internal `v0.1.0` version string already printed in every boot
# banner). Bumping MINOR/MAJOR is a manual decision (tag it yourself with
# the desired version — the next auto-release will continue incrementing
# PATCH from whatever the latest tag says).
# ============================================================================
name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    # Only for a CI run that (a) actually succeeded and (b) ran on `main`
    # itself (a `push` event's own `head_branch`, after a PR merge) — not
    # for CI runs on a PR's own feature branch, which also trigger `CI`
    # but must never produce a release on their own.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # Full tag history is needed to find the latest `vX.Y.Z` tag.
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          set -euo pipefail
          latest_tag="$(git tag -l 'v*' --sort=-v:refname | head -n1)"
          if [ -z "$latest_tag" ]; then
            new_tag="v0.1.0"
          else
            ver="${latest_tag#v}"
            major="${ver%%.*}"
            rest="${ver#*.}"
            minor="${rest%%.*}"
            patch="${rest#*.}"
            new_tag="v${major}.${minor}.$((patch + 1))"
          fi
          echo "Latest tag: ${latest_tag:-<none>} -> new tag: $new_tag"
          echo "tag=$new_tag" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes \
            --target "${{ github.event.workflow_run.head_sha }}"
