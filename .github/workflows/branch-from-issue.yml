# ============================================================================
# Auto-branch from issue — when an issue gets a `bug`/`enhancement`/`hotfix`
# (or `fix`/`feature`/`urgent`/`critical`) label, create a matching
# `fix/`/`feature/`/`hotfix/` branch off `main` automatically, named
# `<prefix>/<issue-number>-<slugified-title>`, and comment the branch name
# back on the issue. Whoever picks up the issue (the owner or a contributor)
# checks that branch out, works on it, and opens a PR into `main` — which
# then goes through the normal CI + owner-approval + auto-release flow (see
# `.github/workflows/{ci,release}.yml` and `CONTRIBUTING.md`).
#
# Runs on both `opened` (in case the issue is filed with a label already)
# and `labeled` (the common case: file first, label right after) — either
# event can supply the matching label. Idempotent: skips if a branch with
# that exact name already exists (e.g. `labeled` firing after `opened`
# already created it, or someone re-labels).
#
# Restricted to the repo owner and collaborators (`author_association` in
# {OWNER, MEMBER, COLLABORATOR}) — this repo is public, so anyone can open
# an issue; without this check, a random label from an outside user would
# still spawn a branch and comment using this workflow's own write token.
# ============================================================================
name: Auto-branch from issue

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

jobs:
  create-branch:
    runs-on: ubuntu-latest
    if: >
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)
    steps:
      - name: Create a branch matching this issue's label
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.issue.labels.map(l => l.name.toLowerCase());
            let prefix = null;
            if (labels.some(l => ['hotfix', 'urgent', 'critical'].includes(l))) {
              prefix = 'hotfix';
            } else if (labels.some(l => ['bug', 'fix'].includes(l))) {
              prefix = 'fix';
            } else if (labels.some(l => ['feature', 'enhancement'].includes(l))) {
              prefix = 'feature';
            }
            if (!prefix) {
              core.info('No feature/fix/hotfix-equivalent label yet - skipping (will retry when a matching label is added).');
              return;
            }

            const issueNumber = context.payload.issue.number;
            const slug = context.payload.issue.title
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, '-')
              .replace(/^-+|-+$/g, '')
              .slice(0, 40);
            const branchName = `${prefix}/${issueNumber}-${slug}`;

            try {
              await github.rest.git.getRef({ owner: context.repo.owner, repo: context.repo.repo, ref: `heads/${branchName}` });
              core.info(`Branch ${branchName} already exists - not creating again.`);
              return;
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            const mainRef = await github.rest.git.getRef({ owner: context.repo.owner, repo: context.repo.repo, ref: 'heads/main' });
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/heads/${branchName}`,
              sha: mainRef.data.object.sha,
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `Branch \`${branchName}\` created from \`main\` for this issue. Check it out, do the work, and open a PR into \`main\` when ready — see \`CONTRIBUTING.md\` for the review/merge/release flow.`,
            });
