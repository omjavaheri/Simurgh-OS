# ============================================================================
# mm-service  (03-Kernel-Subsystems-Layer.md §2.5)
#
# The high-level memory POLICY service — distinct from the kernel's raw
# UntypedMemory mechanism (layer 2). Decides swapping/paging, the OOM
# victim policy (tunable by layer-4 Profile Policy), and coordinates
# unified memory across CPU/GPU/NPU pools where CXL is reported in the
# Hardware Manifest (§2.5).
#
# `#![no_std] + alloc`. `rlib`.
#
# The REAL, separately-built process image (see src/bin/mm-service-bin.rs's
# own doc comment) — "subsystems as processes" packaging, mirroring
# compositor's own `compositor-bin` exactly, a real IPC SERVER (like
# fs-native/compositor), not a client (unlike netstack).
# ============================================================================
[package]
name        = "mm-service"
description = "Simurgh high-level memory policy service (03-Kernel-Subsystems-Layer.md §2.5)"
edition.workspace    = true
version.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true
build = "build.rs"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "mm-service-bin"
path = "src/bin/mm-service-bin.rs"
# Same reasoning as compositor-bin's own `[[bin]]`: a host `cargo test`
# harness would pull in `std` and collide on `panic_impl`.
test = false

[dependencies]
hal-manifest = { path = "../../hal/hal-manifest", default-features = false }
ipc-protocol = { path = "../../ipc-protocol" }
# `subsystem_entry`'s own shared-page marshalling needs `SmallMessage`
# directly (not re-exported by `ipc-protocol` — its own codec module
# takes/returns it by reference to `kernel_ipc` types).
kernel-ipc   = { path = "../../kernel/kernel-ipc" }
